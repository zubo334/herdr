id = "usage-monitor"
name = "Usage Monitor"
version = "0.2.0"
min_herdr_version = "0.9.5"
description = "Open Herdr's native account quota dashboard"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "show-usage"
title = "Show Usage Dashboard"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-Command", "& $env:HERDR_BIN_PATH plugin pane open --plugin usage-monitor --entrypoint dashboard; exit $LASTEXITCODE"]

[[actions]]
id = "show-usage-unix"
title = "Show Usage Dashboard"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin usage-monitor --entrypoint dashboard-unix"]

[[panes]]
id = "dashboard"
title = "Token Usage"
placement = "popup"
width = "60%"
height = "50%"
platforms = ["windows"]
command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-Command", "& $env:HERDR_BIN_PATH usage dashboard; exit $LASTEXITCODE"]

[[panes]]
id = "dashboard-unix"
title = "Account Usage"
placement = "popup"
width = "60%"
height = "50%"
platforms = ["linux", "macos"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" usage dashboard"]
