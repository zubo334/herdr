name: Fork Release

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.8.1)'
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: herdr-windows-x86_64.zip
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'

    runs-on: ${{ matrix.os }}
    env:
      LIBGHOSTTY_VT_OPTIMIZE: ${{ matrix.libghostty_vt_optimize }}
      LIBGHOSTTY_VT_SIMD: ${{ matrix.libghostty_vt_simd }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Restore Zig build cache
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ github.run_id }}
          restore-keys: |
            zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-

      - name: Remove Zig caches
        if: runner.os != 'Windows'
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#fork-v}"
            VERSION="${VERSION#v}"
          fi
          TAG="fork-v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: inputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Extract build metadata
        id: meta
        run: |
          BASE_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          PROTOCOL=$(grep 'pub const PROTOCOL_VERSION' src/protocol/wire.rs | sed 's/.*= \([0-9]*\);/\1/')
          COMMIT=$(git rev-parse HEAD)
          BUILD_ID="fork-$(date -u +%Y-%m-%d)-${COMMIT:0:12}"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "tag": "$TAG",
            "assets": {
              "herdr-linux-x86_64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-linux-x86_64",
              "herdr-linux-aarch64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-linux-aarch64",
              "herdr-macos-x86_64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-macos-x86_64",
              "herdr-macos-aarch64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-macos-aarch64",
              "herdr-windows-x86_64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-windows-x86_64.zip"
            }
          }
          EOF

      - name: Generate preview.json
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BASE="${{ steps.meta.outputs.base_version }}"
          BUILD_ID="${{ steps.meta.outputs.build_id }}"
          COMMIT="${{ steps.meta.outputs.commit }}"
          BUILT_AT="${{ steps.meta.outputs.built_at }}"
          PROTOCOL="${{ steps.meta.outputs.protocol }}"
          REPO="${{ github.repository }}"
          SHA_LINUX_X86=$(sha256sum herdr-linux-x86_64/herdr-linux-x86_64 | cut -d' ' -f1)
          SHA_LINUX_ARM=$(sha256sum herdr-linux-aarch64/herdr-linux-aarch64 | cut -d' ' -f1)
          SHA_MACOS_X86=$(sha256sum herdr-macos-x86_64/herdr-macos-x86_64 | cut -d' ' -f1)
          SHA_MACOS_ARM=$(sha256sum herdr-macos-aarch64/herdr-macos-aarch64 | cut -d' ' -f1)
          SHA_WINDOWS=$(sha256sum herdr-windows-x86_64.zip/herdr-windows-x86_64.zip | cut -d' ' -f1)
          cat > preview.json << EOFPREVIEW
          {
            "schema_version": 1,
            "channel": "preview",
            "base_version": "$BASE",
            "build_id": "$BUILD_ID",
            "commit": "$COMMIT",
            "built_at": "$BUILT_AT",
            "protocol": $PROTOCOL,
            "notes": "Fork release $TAG",
            "builds": {},
            "assets": {
              "linux-x86_64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-linux-x86_64", "sha256": "$SHA_LINUX_X86" },
              "linux-aarch64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-linux-aarch64", "sha256": "$SHA_LINUX_ARM" },
              "macos-x86_64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-macos-x86_64", "sha256": "$SHA_MACOS_X86" },
              "macos-aarch64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-macos-aarch64", "sha256": "$SHA_MACOS_ARM" },
              "windows-x86_64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-windows-x86_64.zip", "sha256": "$SHA_WINDOWS" }
            }
          }
          EOFPREVIEW

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Fork Release v${VERSION}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "Based on upstream herdr v${VERSION} with usage-monitor plugin and UI changes." >> RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            herdr-linux-x86_64/herdr-linux-x86_64
            herdr-linux-aarch64/herdr-linux-aarch64
            herdr-macos-x86_64/herdr-macos-x86_64
            herdr-macos-aarch64/herdr-macos-aarch64
            herdr-windows-x86_64.zip/herdr-windows-x86_64.zip
            latest.json
            preview.json
          body_path: RELEASE_NOTES.md
