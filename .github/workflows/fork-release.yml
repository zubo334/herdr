name: Fork Release

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.8.1)'
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      build_id: ${{ steps.meta.outputs.build_id }}
      commit: ${{ steps.meta.outputs.commit }}
      base_version: ${{ steps.meta.outputs.base_version }}
      built_at: ${{ steps.meta.outputs.built_at }}
      protocol: ${{ steps.meta.outputs.protocol }}
      endpoint_generation: ${{ steps.meta.outputs.endpoint_generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable release metadata
        id: meta
        env:
          FORK_RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/fork_release_metadata.py --github-output "$GITHUB_OUTPUT"

  build:
    needs: metadata
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: herdr-linux-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: herdr-windows-x86_64.zip
            libghostty_vt_optimize: ReleaseFast
            libghostty_vt_simd: 'true'

    runs-on: ${{ matrix.os }}
    env:
      HERDR_BUILD_CHANNEL: ${{ needs.metadata.outputs.channel }}
      HERDR_BUILD_ID: ${{ needs.metadata.outputs.build_id }}
      HERDR_BUILD_COMMIT: ${{ needs.metadata.outputs.commit }}
      LIBGHOSTTY_VT_OPTIMIZE: ${{ matrix.libghostty_vt_optimize }}
      LIBGHOSTTY_VT_SIMD: ${{ matrix.libghostty_vt_simd }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.16
          echo "$(brew --prefix zig@0.16)/bin" >> "$GITHUB_PATH"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build musl-tools gcc-aarch64-linux-gnu crossbuild-essential-arm64

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja

      - name: Set Linux aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Restore Zig build cache
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0-${{ github.run_id }}
          restore-keys: |
            zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.16.0-

      - name: Remove Zig caches
        if: runner.os != 'Windows'
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify native binary version
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || runner.os == 'Windows'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.tag }}
        run: |
          BINARY="target/${{ matrix.target }}/release/herdr"
          if [ "$RUNNER_OS" = "Windows" ]; then BINARY="$BINARY.exe"; fi
          ACTUAL=$("$BINARY" --version | tr -d '\r')
          test "$ACTUAL" = "herdr $EXPECTED_VERSION"

      - name: Rename binary
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $package = Join-Path $env:RUNNER_TEMP "Microsoft.Windows.Console.ConPTY.nupkg"
          $stage = Join-Path $env:RUNNER_TEMP "herdr-windows-x86_64"
          .\scripts\package_windows_conpty.ps1 `
            -HerdrExe target\${{ matrix.target }}\release\herdr.exe `
            -PackagePath $package `
            -StageDir $stage `
            -OutputPath ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Verify or create immutable release tag
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          COMMIT: ${{ needs.metadata.outputs.commit }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
          else
            git tag "$TAG" "$COMMIT"
            git push origin "$TAG"
          fi

      - name: Generate latest.json
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          TAG="${{ needs.metadata.outputs.tag }}"
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "tag": "$TAG",
            "assets": {
              "herdr-linux-x86_64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-linux-x86_64",
              "herdr-linux-aarch64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-linux-aarch64",
              "herdr-macos-x86_64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-macos-x86_64",
              "herdr-macos-aarch64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-macos-aarch64",
              "herdr-windows-x86_64": "https://github.com/${{ github.repository }}/releases/download/$TAG/herdr-windows-x86_64.zip"
            }
          }
          EOF

      - name: Generate preview.json
        run: |
          TAG="${{ needs.metadata.outputs.tag }}"
          BASE="${{ needs.metadata.outputs.base_version }}"
          BUILD_ID="${{ needs.metadata.outputs.build_id }}"
          COMMIT="${{ needs.metadata.outputs.commit }}"
          BUILT_AT="${{ needs.metadata.outputs.built_at }}"
          PROTOCOL="${{ needs.metadata.outputs.protocol }}"
          ENDPOINT_GENERATION="${{ needs.metadata.outputs.endpoint_generation }}"
          REPO="${{ github.repository }}"
          SHA_LINUX_X86=$(sha256sum herdr-linux-x86_64/herdr-linux-x86_64 | cut -d' ' -f1)
          SHA_LINUX_ARM=$(sha256sum herdr-linux-aarch64/herdr-linux-aarch64 | cut -d' ' -f1)
          SHA_MACOS_X86=$(sha256sum herdr-macos-x86_64/herdr-macos-x86_64 | cut -d' ' -f1)
          SHA_MACOS_ARM=$(sha256sum herdr-macos-aarch64/herdr-macos-aarch64 | cut -d' ' -f1)
          SHA_WINDOWS=$(sha256sum herdr-windows-x86_64.zip/herdr-windows-x86_64.zip | cut -d' ' -f1)
          cat > preview.json << EOFPREVIEW
          {
            "schema_version": 1,
            "channel": "preview",
            "base_version": "$BASE",
            "build_id": "$BUILD_ID",
            "commit": "$COMMIT",
            "built_at": "$BUILT_AT",
            "protocol": $PROTOCOL,
            "endpoint_generation": $ENDPOINT_GENERATION,
            "notes": "Fork release $TAG",
            "builds": {},
            "assets": {
              "linux-x86_64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-linux-x86_64", "sha256": "$SHA_LINUX_X86" },
              "linux-aarch64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-linux-aarch64", "sha256": "$SHA_LINUX_ARM" },
              "macos-x86_64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-macos-x86_64", "sha256": "$SHA_MACOS_X86" },
              "macos-aarch64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-macos-aarch64", "sha256": "$SHA_MACOS_ARM" },
              "windows-x86_64": { "url": "https://github.com/$REPO/releases/download/$TAG/herdr-windows-x86_64.zip", "sha256": "$SHA_WINDOWS" }
            }
          }
          EOFPREVIEW

      - name: Generate release notes
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          echo "## Fork Release v${VERSION}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          BASE_VERSION="${{ needs.metadata.outputs.base_version }}"
          echo "Based on upstream herdr v${BASE_VERSION} with native account usage and UI changes." >> RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: |
            herdr-linux-x86_64/herdr-linux-x86_64
            herdr-linux-aarch64/herdr-linux-aarch64
            herdr-macos-x86_64/herdr-macos-x86_64
            herdr-macos-aarch64/herdr-macos-aarch64
            herdr-windows-x86_64.zip/herdr-windows-x86_64.zip
            latest.json
            preview.json
          body_path: RELEASE_NOTES.md
